    <style>
        /* Page-specific layout: let main-content extend further right */
        .center-strip { width: 100vw; margin: 0; }
        .center-strip .content-grid {
            position: static;
            left: auto;
            display: grid;
            /* Use a single, consistent column definition (avoid mixed 4fr/1fr vs fixed 260px pushing issues) */
            grid-template-columns: 1fr 260px;
            gap: 0;
        }
        #main-content { display: flex; flex-direction: column; align-items: center; width: auto; margin-top: -1750px;}

        .right-nav .nav-logo {
            display: flex;
            justify-content: center;
            padding: 16px 10px 6px;
        }
        .right-nav .nav-logo img {
            width: min(180px, 90%);
            height: auto;
            border: 0;
            border-radius: 0;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 1));
            transition: transform 0.25s ease;
            cursor: pointer;
        }
        .right-nav .nav-logo img:hover { transform: scale(1.05); }

        @media (max-width: 1000px) {
            .center-strip .content-grid { grid-template-columns: 1fr; }
            .right-nav .nav-logo { padding-top: 10px; }
            .right-nav .nav-logo img { width: min(140px, 70%); }
        }

        @media (max-width: 1000px) {
            .right-nav { width: auto; max-width: none; }
            .center-strip .content-grid { grid-template-columns: 1fr; }
        }


        :root { --gallery-max: 1280px; }

        .gallery-toolbar,
        .gallery-grid {
            width: min(var(--gallery-max), 100%);
            box-sizing: border-box;
        }

        .gallery-toolbar {
            margin: 10px auto 12px;
            padding: 10px;
        }

        .gallery-grid {
            margin: 0 auto;
            padding: 0;
        }

        .gallery-toolbar * { box-sizing: border-box; }

        .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        }

        .gallery-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin: 10px auto 12px;
            padding: 10px;
            width: min(1100px, 100%);
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.35));
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .gallery-toolbar .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .gallery-toolbar label { font-family: National-Park, sans-serif; color: #111; font-weight: 700; }
        .gallery-toolbar select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 2px solid #888;
            background: linear-gradient(to bottom, #ffffff, #d7d7d7);
            color: #111;
            font-weight: 700;
        }
        .gallery-toolbar .hint { font-size: 0.9rem; color: #222; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
            width: min(1100px, 100%);
        }

        .gallery-grid .thumb {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: pointer;
            background: #fff;
        }
        .gallery-grid .thumb:hover { box-shadow: 0 0 20px rgba(255, 210, 74, 0.55); }

        /* Overlay viewer */
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; align-items:center; justify-content:center; background: rgba(0,0,0,0.85); z-index: 1000; cursor: zoom-out; }
        #overlay-img {
            max-width: 92vw;
            max-height: 86vh;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: grab;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 18px rgba(0,0,0,0.6);
            transform: translate(0,0) scale(1);
            transition: transform 120ms ease-out;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
        }
        #overlay-img.dragging { cursor: grabbing; transition: none; }
        #overlay-caption { color:#fff; margin-top:10px; text-align: center; max-width: 900px; padding: 0 12px; }

        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
        }

        :root { --gallery-max: 1280px; }

        #main-content > .container { width: 80%; margin-top: 0; padding-top: 0; }
        #tabs-content { width: 100%; margin-top: 8px; }
        #gallery-section.section { width: 100%; margin-top: 6px; }
        #gallery-section { margin-left: 0; margin-right: 0; }

        .dms-header { margin-bottom: 6px; }
        .gallery-toolbar { margin-top: 6px; }

        .gallery-toolbar .group.viewmode { justify-content: flex-end; }

        .timeline {
            width: min(var(--gallery-max), 100%);
            margin: 0 auto;
            box-sizing: border-box;
        }

        .timeline-section {
            margin: 12px 0 18px 0;
            padding: 10px;
            border-radius: 10px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.65), rgba(255,255,255,0.35));
            border: 2px solid rgba(0,0,0,0.15);
        }

        .timeline-section h3 {
            margin: 0 0 10px 0;
            font-family: National-Park-Heavy, sans-serif;
            color: #111;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.65);
        }

        .timeline-section .gallery-grid { width: 100%; }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('overlay');
            const overlayImg = document.getElementById('overlay-img');
            const overlayCaption = document.getElementById('overlay-caption');
            const filter = document.getElementById('gallery-filter');
            const gallery = document.getElementById('gallery');
            const sourcesRoot = document.getElementById('image-sources');
            const viewMode = document.getElementById('view-mode');
            const timeline = document.getElementById('timeline');

            if (!overlay || !overlayImg || !overlayCaption || !filter || !gallery || !sourcesRoot || !viewMode || !timeline) return;

            // Initialize shared overlay helpers (functions.js)
            if (window.initImageOverlay) window.initImageOverlay({ overlayId: 'overlay', imageId: 'overlay-img', captionId: 'overlay-caption' });

            const openOverlay = (src, alt) => {
                if (window.openImageOverlay) window.openImageOverlay(src, alt);
            };

            const buildThumb = (img) => {
                const li = document.createElement('li');
                const thumb = document.createElement('img');
                thumb.className = 'thumb';
                thumb.src = img.getAttribute('src');
                thumb.alt = img.getAttribute('alt') || '';
                thumb.loading = 'lazy';
                thumb.addEventListener('click', () => openOverlay(thumb.src, thumb.alt));
                li.appendChild(thumb);
                return li;
            };

            const getBucketImgs = (bucketId) => {
                const bucket = document.getElementById(bucketId);
                return bucket ? Array.from(bucket.querySelectorAll('img')) : [];
            };

            const uniqueBySrc = (imgs) => {
                const seen = new Set();
                return imgs.filter(img => {
                    const src = img.getAttribute('src') || '';
                    if (!src || seen.has(src)) return false;
                    seen.add(src);
                    return true;
                });
            };

            const getImagesForKey = (key) => {
                let imgs = [];
                if (key === 'all') imgs = Array.from(sourcesRoot.querySelectorAll('img'));
                else if (key === '2d') imgs = getBucketImgs('cat-2d');
                else if (key === 'bo') imgs = getBucketImgs('cat-bo');
                else if (key === 'gabe') imgs = getBucketImgs('cat-gabe');
                else if (key === 'studies') imgs = getBucketImgs('cat-studies');
                else if (key === 'misc') imgs = getBucketImgs('cat-misc');
                else if (key === 'kewl') imgs = getBucketImgs('cat-kewl');

                return uniqueBySrc(imgs);
            };

            const termOrder = ['Spring 2025', 'Summer 2025', 'Fall 2025', 'Spring 2026', 'Summer 2026', 'Fall 2026', 'Misc'];

            const getImgTerm = (img) => img.getAttribute('data-term') || img.closest('[data-term]')?.getAttribute('data-term') || 'Misc';

            const renderTimeline = (key) => {
                timeline.innerHTML = '';
                const imgs = getImagesForKey(key);

                // Group by term
                const groups = new Map();
                imgs.forEach(img => {
                    const term = getImgTerm(img);
                    if (!groups.has(term)) groups.set(term, []);
                    groups.get(term).push(img);
                });

                termOrder
                    .filter(term => groups.has(term))
                    .forEach(term => {
                        const section = document.createElement('section');
                        section.className = 'timeline-section';

                        const h = document.createElement('h3');
                        h.textContent = term;
                        section.appendChild(h);

                        const ul = document.createElement('ul');
                        ul.className = 'gallery-grid';
                        groups.get(term).forEach(img => ul.appendChild(buildThumb(img)));
                        section.appendChild(ul);

                        timeline.appendChild(section);
                    });
            };

            const renderGallery = (key) => {
                gallery.innerHTML = '';
                const imgs = getImagesForKey(key);

                imgs.forEach(img => gallery.appendChild(buildThumb(img)));
            };

            const renderCurrent = () => {
                const cat = filter.value;
                const mode = viewMode.value;
                if (mode === 'timeline') {
                    gallery.style.display = 'none';
                    timeline.style.display = 'block';
                    renderTimeline(cat);
                } else {
                    timeline.style.display = 'none';
                    gallery.style.display = 'grid';
                    renderGallery(cat);
                }
            };

            overlay.addEventListener('click', function(event) {
                if (event.target !== overlayImg) {
                    overlay.style.display = 'none';
                    overlayImg.dataset.zoomed = '0';
                    overlayImg.style.transform = 'translate(0,0) scale(1)';
                }
            });

            viewMode.addEventListener('change', renderCurrent);
            filter.addEventListener('change', renderCurrent);

            // Initial
            renderCurrent();
        });
    </script>
