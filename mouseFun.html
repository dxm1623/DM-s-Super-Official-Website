<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM's Fun With Cursor Stuff!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: none;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #cursorStyleChanger {
            margin-bottom: 20px;
        }

        .buttons {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #cursor {
            width: 50px;
            height: 50px;
            aspect-ratio: 1;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            left: 200px;
            top: 200px;
            translate: -50% -50%;
            pointer-events: none;
        }
    </style>
    <!--CHECK WEIRDNESS WITH PUSHING SITE-->
</head>
<body>
    <div id="cursorStyleChanger">
        <button class="buttons" id="cursorStyleButton" onclick="changeCursorStyle()">Change Cursor Style</button>
    </div>
    <div id="drawingStyleChanger">
        <button class="buttons" id="drawingStyleButton" onclick="changeDrawingStyle()">Change Drawing Style</button>
    </div>
    <div id="cursor"></div>

</body>
<script>
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    document.body.appendChild(canvas);

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function init() {
        resizeCanvas();
        canvas.style.position = "absolute";
        canvas.style.top = 0;
        canvas.style.left = 0;
        canvas.style.zIndex = -1;
    }

    let drawing = false;
    let lastX = 0;
    let lastY = 0;
    let lastTime = 0;
    const maxSize = 100;
    const minSize = 1;

    function startDrawing(event) {
        drawing = true;
        draw(event);
    }

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    const colors = ["black", "green", "blue", "red", "yellow", "purple", "orange", "pink"];
    let currentColorIndex = 0;
    const shapes = ["line", "circle", "square"];
    let currentShapeIndex = 0;

    //When cursor leaves screen
    //Set leftScreen to true

    function draw(event) {
        //If leftScreen
        //set leftScreen to false
        //return

        let leftScreen = false;
        if (event.clientX < 0 || event.clientX > window.innerWidth || event.clientY < 0 || event.clientY > window.innerHeight) {
            leftScreen = true;
        }

        if (leftScreen) {
            drawing = false;
            leftScreen = false;
            return;
        }

        if (!drawing) return;

        const currentTime = new Date().getTime();
        const timeDiff = currentTime - lastTime;
        const distance = Math.sqrt(Math.pow(event.clientX - lastX, 2) + Math.pow(event.clientY - lastY, 2));
        const speed = distance / timeDiff;

        const lineWidth = Math.min(maxSize, Math.max(minSize, speed * 10));

        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.strokeStyle = colors[currentColorIndex];
        ctx.fillStyle = colors[currentColorIndex];

        const shape = shapes[currentShapeIndex];

        if (shape === "line") {
            ctx.lineTo(event.clientX, event.clientY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(event.clientX, event.clientY);
        } else if (shape === "circle") {
            ctx.beginPath();
            ctx.arc(event.clientX, event.clientY, lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
        } else if (shape === "square") {
            ctx.fillRect(event.clientX - lineWidth / 2, event.clientY - lineWidth / 2, lineWidth, lineWidth);
        }

        lastX = event.clientX;
        lastY = event.clientY;
        lastTime = currentTime;
    }

    function changeDrawingStyle() {
        currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
        const drawingButton = document.getElementById("drawingStyleButton");
        drawingButton.textContent = `Drawing Style: ${shapes[currentShapeIndex]}`;
    }

    function changeCursorStyle() {
        currentColorIndex = (currentColorIndex + 1) % colors.length;
        cursor.style.backgroundColor = colors[currentColorIndex];
    }

    function updateCursor(event) {
        cursor.style.left = event.x + "px";
        cursor.style.top = event.y + "px";
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mousemove", draw);

    window.onload = init;
    window.onresize = resizeCanvas;
    window.onmousemove = updateCursor;
</script>
<script src="functions.js"></script>
</html>
